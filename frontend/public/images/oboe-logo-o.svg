<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
<title id="title">Oboe O Logo</title>
<desc id="desc">Modern rounded-square logo mark with a stylized letter O for Oboe.</desc>
<defs>
<linearGradient id="bg" x1="18" y1="14" x2="110" y2="114" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#fff7fb"/>
<stop offset="1" stop-color="#f7e4ee"/>
</linearGradient>
<linearGradient id="ring" x1="34" y1="24" x2="94" y2="104" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#d10d5d"/>
<stop offset="1" stop-color="#9f033e"/>
</linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8e0f43" flood-opacity=".18"/>
</filter>
</defs>
<rect x="10" y="10" width="108" height="108" rx="28" fill="url(#bg)"/>
<rect x="10" y="10" width="108" height="108" rx="28" fill="none" stroke="#f0c8d9" stroke-width="2"/>
<g filter="url(#shadow)">
<circle cx="64" cy="64" r="31" fill="none" stroke="url(#ring)" stroke-width="14"/>
<path d="M86 35c-4 1-8 4-11 8" fill="none" stroke="#f6a5c3" stroke-linecap="round" stroke-width="6"/>
<circle cx="85" cy="42" r="5" fill="#f3b5cb"/>
</g>
<circle cx="64" cy="64" r="8" fill="#b90449" opacity=".12"/>
</svg>

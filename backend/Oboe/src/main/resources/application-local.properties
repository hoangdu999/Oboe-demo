# ============================================================
# Cấu hình chạy LOCAL (profile: local) - không phụ thuộc AWS
# Chạy: mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=local"
# ============================================================

# ---------- Nạp biến local bí mật ----------
spring.config.import=optional:file:.env.local[.properties]

# ---------- Database (MySQL local) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/oboe_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Saigon&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tự tạo/cập nhật bảng từ Entity (lần đầu chạy DB trống sẽ tự sinh schema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Server ----------
server.address=127.0.0.1
server.port=8080
app.domain=http://localhost:8080

# ---------- Lưu file local (thay thế AWS S3) ----------
app.file-storage.dir=uploads
app.file-storage.base-url=http://localhost:8080/uploads

# ---------- Mail (giá trị giả, không gửi được mail thật ở local) ----------
spring.mail.username=local@localhost
spring.mail.password=local

# ---------- OAuth2 (không dùng ở local) ----------
spring.security.oauth2.client.registration.google.client-id=local
spring.security.oauth2.client.registration.google.client-secret=local
spring.security.oauth2.client.registration.facebook.client-id=local
spring.security.oauth2.client.registration.facebook.client-secret=local

# ---------- MoMo (không dùng ở local) ----------
momo.accessKey=local
momo.secretKey=local

# ---------- PayOS (không dùng ở local) ----------
payos.client-id=local
payos.api-key=local
payos.checksum-key=local

# ---------- Gemini AI ----------
# Khuyến nghị: chỉ cần đặt GEMINI_API_KEY trong file .env.local
# GEMINI_MODEL có thể để mặc định là gemini-2.5-flash
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.8-flash}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
# Tuỳ chọn override toàn bộ URL nếu cần
gemini.api.url=${GEMINI_API_URL:http://localhost/gemini-not-configured}
